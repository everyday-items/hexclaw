name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure private modules
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
        env:
          GOPRIVATE: github.com/hexagon-codes/*

      - name: Run tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
        env:
          GOPRIVATE: github.com/hexagon-codes/*

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.out

  test-windows:
    name: Test (Windows Sandbox)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure private modules
        shell: pwsh
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
        env:
          GOPRIVATE: github.com/hexagon-codes/*

      - name: Build all
        run: go build ./...
        env:
          GOPRIVATE: github.com/hexagon-codes/*

      - name: Run sandbox tests
        run: go test -v -count=1 -timeout 120s ./skill/sandbox/...
        env:
          GOPRIVATE: github.com/hexagon-codes/*

      # 核心套件大量断言 Unix 专属可观测值 (文件权限位 0600/0640/0755、HOME 与 ~ 展开、POSIX 路径),
      # 在 Windows 上非可移植 (产品代码可用, 是测试断言不跨平台), 重构前即非绿。降为提示性:
      # Windows 硬门禁仅保留"可编译 + sandbox 实现"; 核心功能全量验证在 Linux job (go test -race ./...)。
      # 待核心测试跨平台可移植化后恢复硬门禁。
      - name: Run core tests (advisory on Windows)
        continue-on-error: true
        run: go test -count=1 -timeout 300s ./engine/... ./config/... ./security/... ./mcp/... ./session/... ./skill/...
        env:
          GOPRIVATE: github.com/hexagon-codes/*

  test-macos:
    name: Test (macOS Sandbox)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure private modules
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
        env:
          GOPRIVATE: github.com/hexagon-codes/*

      - name: Run sandbox tests
        run: go test -v -count=1 -timeout 120s ./skill/sandbox/...
        env:
          GOPRIVATE: github.com/hexagon-codes/*
